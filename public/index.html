<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaConvert - Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="header-top">
            <div class="logo">🎵 MediaConvert</div>
            <div class="lang-container">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en" selected>English 🇬🇧</option>
                    <option value="az">Azərbaycan 🇦🇿</option>
                    <option value="ru">Русский 🇷🇺</option>
                </select>
            </div>
        </div>
        
        <div class="platform-options">
            <button class="platform-btn active" data-platform="youtube" id="btnTabYoutube">YouTube</button>
            <button class="platform-btn" data-platform="tiktok" id="btnTabTiktok">TikTok</button>
        </div>

        <p class="subtitle" id="subtitleText">Download YouTube videos as MP3 audio or MP4 video</p>
        
        <div class="form-group">
            <input type="text" id="urlInput" placeholder="Paste YouTube video URL here..." autocomplete="off">
        </div>

        <div class="format-options">
            <button class="format-btn active" data-format="mp3" id="btnMp3">MP3 (Audio)</button>
            <button class="format-btn" data-format="mp4" id="btnMp4">MP4 (Video)</button>
        </div>

        <div class="quality-group" id="qualityContainer">
            <label id="qualityLabel" for="qualitySelect">Quality:</label>
            <select id="qualitySelect"></select>
        </div>

        <button id="convertBtn" onclick="processMedia()">Prepare Download</button>

        <div id="statusArea" class="status-area"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
